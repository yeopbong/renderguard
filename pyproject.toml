[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renderguard"
version = "0.1.0rc2"
description = "A local workbench for evidence-based visual change review"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.116.1", "uvicorn==0.35.0", "onnxruntime==1.22.1", "pillow==11.3.0", "numpy==2.5.3"]

[project.scripts]
renderguard = "server.app:main"
renderguard-gate = "server.gate:main"

[tool.setuptools]
packages = ["server", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
